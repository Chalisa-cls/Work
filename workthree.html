<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Product Card Challenge</title>
</head>
<body>

    <div class="product-card">
        <img src="backpack.png" alt="Leather Backpack" class="product-image">
        
        <div class="product-title">Leather Backpack</div>
        <div class="product-price">1.8em</div>
        <div class="product-id">#28a7.99</div>
        
        <button class="add-to-cart-btn">Add to Cart</button>
    </div>

</body>
</html>
